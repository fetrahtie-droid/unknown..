<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Türkçe Konuşma Pratiği</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#080810;--bg2:#10101c;--bg3:#18182a;
  --bd:rgba(255,255,255,.07);--bd2:rgba(255,255,255,.14);
  --tx:#eeeef8;--tx2:#8888aa;--tx3:#50506a;
  --fd:'Playfair Display',Georgia,serif;--fb:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--fb);background:var(--bg);color:var(--tx);overflow-x:hidden}
button,textarea{font-family:var(--fb);cursor:pointer}
.screen{display:none;min-height:100vh}
.screen.on{display:flex;flex-direction:column}

/* HOME */
#home{align-items:center;justify-content:center;padding:36px 20px;position:relative;overflow:hidden}
#home::before{content:'';position:fixed;top:-140px;left:-140px;width:480px;height:480px;
  background:radial-gradient(circle,rgba(160,80,255,.07) 0%,transparent 70%);pointer-events:none}
#home::after{content:'';position:fixed;bottom:-120px;right:-60px;width:380px;height:380px;
  background:radial-gradient(circle,rgba(80,140,255,.06) 0%,transparent 70%);pointer-events:none}
.home-inner{width:100%;max-width:460px;display:flex;flex-direction:column;align-items:center;gap:32px;position:relative;z-index:1}
.hero{text-align:center;animation:up .6s ease both}
.flag{font-size:54px;display:block;margin-bottom:12px;filter:drop-shadow(0 0 22px rgba(255,255,255,.12))}
h1{font-family:var(--fd);font-size:clamp(36px,8vw,54px);font-weight:900;line-height:1.06;
  background:linear-gradient(140deg,#fff 0%,#8888cc 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:10px}
.hero p{color:var(--tx2);font-size:13.5px;font-weight:300;line-height:1.7}
.hero p b{color:var(--tx);font-weight:500}
.lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--tx3);text-align:center;margin-bottom:11px}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:11px;width:100%;animation:up .55s .1s ease both}
.lv{background:var(--bg2);border:1.5px solid var(--bd);border-radius:14px;
  padding:20px 16px 16px;text-align:left;transition:transform .2s,border-color .2s;position:relative;overflow:hidden}
.lv:hover{transform:translateY(-3px);border-color:var(--c)}
.lv-cnt{position:absolute;top:11px;right:11px;font-size:10px;color:var(--tx3);background:var(--bg3);padding:2px 7px;border-radius:20px}
.lv-id{font-family:var(--fd);font-size:32px;font-weight:900;color:var(--c);line-height:1;margin-bottom:5px}
.lv-nm{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--c);margin-bottom:2px}
.lv-uz{font-size:11px;color:var(--tx3);font-weight:300}

/* TOPICS */
#topics{padding:0}
.tbar{padding:18px 18px 0;display:flex;align-items:center;gap:11px;flex-shrink:0}
.back{width:38px;height:38px;background:var(--bg2);border:1px solid var(--bd);color:var(--tx2);
  border-radius:10px;display:flex;align-items:center;justify-content:center;transition:background .17s,color .17s;flex-shrink:0}
.back:hover{background:var(--bg3);color:var(--tx)}
.bt{font-family:var(--fd);font-size:21px;font-weight:700}
.bs{font-size:11px;color:var(--tx3);margin-top:2px}
.tlist{flex:1;overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:8px}
.tp{background:var(--bg2);border:1px solid var(--bd);border-radius:13px;
  padding:14px 15px;display:flex;align-items:center;gap:12px;
  text-align:left;transition:background .17s,border-color .17s,transform .17s;animation:up .3s ease both}
.tp:hover{background:var(--bg3);border-color:var(--c);transform:translateX(4px)}
.ti{width:44px;height:44px;background:var(--bg3);border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.ttr{font-size:14px;font-weight:500;color:var(--tx);margin-bottom:2px}
.tuz{font-size:11px;color:var(--tx3)}
.tarr{color:var(--tx3);transition:transform .17s}
.tp:hover .tarr{transform:translateX(4px);color:var(--tx2)}

/* CHAT */
#chat{height:100vh;max-width:700px;margin:0 auto;width:100%}
.ctop{padding:13px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;flex-shrink:0}
.ci{flex:1;min-width:0}
.cttl{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmeta{font-size:11px;color:var(--tx3);margin-top:1px}
.cpill{font-family:var(--fd);font-size:16px;font-weight:700;padding:3px 11px;border-radius:7px;border:1.5px solid;flex-shrink:0}
.hico{width:34px;height:34px;background:var(--bg2);border:1px solid var(--bd);color:var(--tx2);
  border-radius:8px;display:flex;align-items:center;justify-content:center;transition:background .17s,color .17s;flex-shrink:0}
.hico:hover{background:var(--bg3);color:var(--tx)}
.msgs{flex:1;overflow-y:auto;padding:15px 16px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.msgs::-webkit-scrollbar{width:3px}
.msgs::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:2px}
.wel{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:40px}
.wico{font-size:48px}
.wttl{font-size:16px;font-weight:500;color:var(--tx);line-height:1.5}
.wsub{font-size:12px;color:var(--tx2);line-height:1.65}
.sbtn{display:flex;align-items:center;gap:8px;padding:12px 26px;border-radius:10px;
  border:none;font-size:14px;font-weight:600;color:#000;transition:filter .2s,transform .18s}
.sbtn:hover{filter:brightness(1.12);transform:translateY(-2px)}
.msg{display:flex;gap:8px;animation:up .27s ease both}
.msg.u{flex-direction:row-reverse}
.av{width:30px;height:30px;border-radius:9px;background:var(--bg3);border:1px solid var(--bd);
  display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;align-self:flex-end}
.bub{max-width:72%;padding:11px 14px;border-radius:10px;font-size:13.5px;line-height:1.65;
  background:var(--bg2);border:1px solid var(--bd);color:var(--tx)}
.msg.u .bub{background:var(--bg3);border-bottom-right-radius:3px}
.msg.ai .bub{border-bottom-left-radius:3px}
.tip{margin-top:8px;padding-top:8px;border-top:1px solid var(--bd);font-size:12px;color:var(--tx2);line-height:1.5}
.typing{display:flex;gap:5px;padding:3px 2px;align-items:center}
.td{width:6px;height:6px;background:var(--tx3);border-radius:50%;animation:bounce 1.1s infinite}
.td:nth-child(2){animation-delay:.18s}.td:nth-child(3){animation-delay:.36s}
.err{margin:0 16px 10px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);
  border-radius:8px;padding:9px 13px;font-size:12px;color:#fca5a5;display:none}
.err.on{display:block}
.iarea{padding:13px 16px;border-top:1px solid var(--bd);flex-shrink:0;display:none}
.iarea.on{display:block}
.irow{display:flex;gap:9px;align-items:flex-end}
textarea.cta{flex:1;background:var(--bg2);border:1px solid var(--bd);border-radius:10px;
  padding:11px 14px;color:var(--tx);font-size:13.5px;resize:none;outline:none;
  transition:border .2s;max-height:110px;line-height:1.55}
textarea.cta::placeholder{color:var(--tx3)}
textarea.cta:focus{border-color:var(--bd2)}
.snd{width:42px;height:42px;border-radius:10px;border:none;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;transition:opacity .18s,transform .15s}
.snd:disabled{opacity:.32;cursor:not-allowed}
.snd:not(:disabled):hover{filter:brightness(1.13);transform:scale(1.07)}
.ihint{margin-top:6px;font-size:11px;color:var(--tx3);text-align:center}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
</style>
</head>
<body>

<!-- HOME -->
<div id="home" class="screen on">
  <div class="home-inner">
    <div class="hero">
      <span class="flag">🇹🇷</span>
      <h1>Türkçe<br>Konuşma</h1>
      <p>AI muallim bilan <b>turk tilida</b> suhbat mashqi<br>4 daraja &nbsp;•&nbsp; 24 mavzu &nbsp;•&nbsp; Bepul</p>
    </div>
    <div style="width:100%">
      <div class="lbl">Darajani tanlang</div>
      <div class="levels" id="lvGrid"></div>
    </div>
  </div>
</div>

<!-- TOPICS -->
<div id="topics" class="screen">
  <div class="tbar">
    <button class="back" onclick="go('home')">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    </button>
    <div><div class="bt" id="bTtl"></div><div class="bs">Mavzu tanlang</div></div>
  </div>
  <div class="tlist" id="tList"></div>
</div>

<!-- CHAT -->
<div id="chat" class="screen">
  <div class="ctop">
    <button class="back" onclick="go('topics')">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    </button>
    <div class="ci">
      <div class="cttl" id="cTtl"></div>
      <div class="cmeta" id="cMeta"></div>
    </div>
    <div class="cpill" id="cPill"></div>
    <button class="hico" onclick="go('home')">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
    </button>
  </div>
  <div class="msgs" id="msgs">
    <div class="wel" id="wel">
      <span class="wico" id="wIco"></span>
      <div class="wttl" id="wTtl"></div>
      <div class="wsub">AI muallim suhbatni boshlaydi<br>xatolaringizni muloyimlik bilan tuzatadi</div>
      <button class="sbtn" id="sBt" onclick="startChat()">
        <svg width="13" height="13" fill="currentColor" viewBox="0 0 24 24"><path d="M5 3l14 9-14 9V3z"/></svg>
        Boshlash
      </button>
    </div>
  </div>
  <div class="err" id="errBar"></div>
  <div class="iarea" id="iArea">
    <div class="irow">
      <textarea class="cta" id="cTa" placeholder="Turkcha yozing… (Enter = yuborish)"
        rows="1" oninput="rsz(this)" onkeydown="taK(event)"></textarea>
      <button class="snd" id="sndBtn" onclick="send()" disabled>
        <svg width="15" height="15" fill="none" stroke="#000" stroke-width="2.5" viewBox="0 0 24 24">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22,2 15,22 11,13 2,9"/>
        </svg>
      </button>
    </div>
    <div class="ihint">Enter — yuborish &nbsp;•&nbsp; Shift+Enter — yangi qator</div>
  </div>
</div>

<script>
// ========================================================
// 🔑 API KALIT — shu yerga o'z kalitingizni qo'ying
// console.anthropic.com → API Keys → Create Key
// ========================================================
const API_KEY = 'YOUR_API_KEY_HERE';
// ========================================================

const DATA=[
  {id:'A1',name:'Başlangıç',uz:"Boshlang'ich",c:'#4ade80',bd:'rgba(74,222,128,.28)',
   sys:"Çok basit, kısa cümleler kullan. Gerektiğinde parantez içinde Özbekçe açıkla.",
   topics:[
    {id:'t1',tr:'Tanışma ve Selamlaşma',   uz:'Tanishish va salomlashish', e:'👋'},
    {id:'t2',tr:'Aile ve Arkadaşlar',       uz:"Oila va do'stlar",          e:'👨‍👩‍👧'},
    {id:'t3',tr:'Renkler, Sayılar ve Günler',uz:'Ranglar, raqamlar, kunlar', e:'🎨'},
    {id:'t4',tr:'Yemek ve İçecekler',       uz:'Taom va ichimliklar',        e:'🍽️'},
    {id:'t5',tr:'Alışveriş ve Fiyatlar',    uz:'Xarid va narxlar',           e:'🛒'},
    {id:'t6',tr:'Yol Tarifi ve Yerler',     uz:"Yo'l ko'rsatish va joylar",  e:'🗺️'},
   ]},
  {id:'B1',name:'Orta Seviye',uz:"O'rta daraja",c:'#60a5fa',bd:'rgba(96,165,250,.28)',
   sys:"Orta seviye Türkçe kullan. Zor kelimeleri kısaca açıkla.",
   topics:[
    {id:'t1',tr:'İş Hayatı ve Kariyer', uz:'Ish hayoti va karyera',  e:'💼'},
    {id:'t2',tr:'Seyahat ve Tatil',     uz:"Sayohat va ta'til",       e:'✈️'},
    {id:'t3',tr:'Sağlık ve Hastane',    uz:"Sog'liq va kasalxona",    e:'🏥'},
    {id:'t4',tr:'Hava Durumu ve Doğa',  uz:'Ob-havo va tabiat',       e:'🌤️'},
    {id:'t5',tr:'Ev ve Günlük Hayat',   uz:'Uy va kundalik hayot',    e:'🏠'},
    {id:'t6',tr:'Hobiler ve Boş Zaman', uz:"Hobi va bo'sh vaqt",      e:'🎭'},
   ]},
  {id:'B2',name:'İleri Orta',uz:"Yuqori o'rta",c:'#f59e0b',bd:'rgba(245,158,11,.28)',
   sys:"Zengin kelime hazinesiyle konuş. Deyimler ve kalıpları göster.",
   topics:[
    {id:'t1',tr:'Teknoloji ve Dijital Dünya', uz:'Texnologiya va raqamli dunyo',e:'💻'},
    {id:'t2',tr:'Eğitim ve Öğrenme',          uz:"Ta'lim va o'rganish",         e:'🎓'},
    {id:'t3',tr:'Ekonomi ve Finans',           uz:'Iqtisodiyot va moliya',       e:'📊'},
    {id:'t4',tr:'Kültür ve Sanat',             uz:"Madaniyat va san'at",         e:'🎭'},
    {id:'t5',tr:'Çevre ve Sürdürülebilirlik',  uz:'Atrof-muhit va barqarorlik',  e:'🌱'},
    {id:'t6',tr:'Medya ve Haberler',            uz:'Media va yangiliklar',        e:'📰'},
   ]},
  {id:'C1',name:'İleri Seviye',uz:"Ilg'or daraja",c:'#e879f9',bd:'rgba(232,121,249,.28)',
   sys:"İleri seviye Türkçe kullan. Akademik ve karmaşık yapılar kullan.",
   topics:[
    {id:'t1',tr:'Siyaset ve Demokrasi',    uz:'Siyosat va demokratiya', e:'🏛️'},
    {id:'t2',tr:'Felsefe ve Etik',          uz:'Falsafa va etika',        e:'🧠'},
    {id:'t3',tr:'Bilim ve Araştırma',       uz:'Fan va tadqiqot',         e:'🔬'},
    {id:'t4',tr:'Uluslararası İş Dünyası', uz:'Xalqaro biznes',          e:'🌐'},
    {id:'t5',tr:'Hukuk ve Adalet',          uz:'Huquq va adolat',         e:'⚖️'},
    {id:'t6',tr:'Küresel Sorunlar',          uz:'Global muammolar',        e:'🌍'},
   ]},
];

let lv=null,tp=null,msgs=[],busy=false;

/* INIT */
document.getElementById('lvGrid').innerHTML=DATA.map(d=>`
  <button class="lv" style="--c:${d.c}" onclick="pickLv('${d.id}')">
    <span class="lv-cnt">${d.topics.length} mavzu</span>
    <div class="lv-id">${d.id}</div>
    <div class="lv-nm">${d.name}</div>
    <div class="lv-uz">${d.uz}</div>
  </button>`).join('');

function go(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
}

function pickLv(id){
  lv=DATA.find(d=>d.id===id);
  document.getElementById('bTtl').innerHTML=`<span style="color:${lv.c}">${lv.id}</span> — ${lv.name}`;
  document.getElementById('tList').innerHTML=lv.topics.map((t,i)=>`
    <button class="tp" style="--c:${lv.c};animation-delay:${i*.06}s" onclick="pickTp('${t.id}')">
      <span class="ti">${t.e}</span>
      <div style="flex:1">
        <div class="ttr">${t.tr}</div>
        <div class="tuz">${t.uz}</div>
      </div>
      <svg class="tarr" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </button>`).join('');
  go('topics');
}

function pickTp(id){
  tp=lv.topics.find(t=>t.id===id);
  msgs=[];
  /* reset chat */
  document.getElementById('cTtl').textContent=tp.e+' '+tp.tr;
  document.getElementById('cMeta').textContent=tp.uz;
  const p=document.getElementById('cPill');
  p.textContent=lv.id; p.style.color=lv.c; p.style.borderColor=lv.bd;
  document.getElementById('sBt').style.background=lv.c;
  document.getElementById('sndBtn').style.background=lv.c;
  document.getElementById('wIco').textContent=tp.e;
  document.getElementById('wTtl').innerHTML=`"${tp.tr}"<br><span style="font-size:13px;color:#8888aa;font-weight:300">mavzusida boshlashga tayyormisiz?</span>`;
  document.getElementById('wel').style.display='flex';
  document.getElementById('iArea').classList.remove('on');
  document.getElementById('errBar').classList.remove('on');
  document.getElementById('cTa').value='';
  document.getElementById('sndBtn').disabled=true;
  const box=document.getElementById('msgs');
  [...box.children].forEach(c=>{if(c.id!=='wel')c.remove();});
  go('chat');
}

async function startChat(){
  document.getElementById('wel').style.display='none';
  document.getElementById('iArea').classList.add('on');
  await ai([{role:'user',content:'Başlayalım! Konuşmayı sen başlat.'}],true);
}

async function ai(m,isStart=false){
  if(busy)return;
  busy=true; dis(true); addTyping(); hideErr();
  const sys=`Sen bir Türkçe dil öğretmenisin. Öğrenciye ${lv.id} seviyesinde "${tp.uz}" konusunda konuşma pratiği yaptırıyorsun.
KURALLAR:
- ${lv.sys}
- Konuyu "${tp.tr}" ile sınırlı tut.
- Her cevapta öğrenciyi konuşturmak için bir soru sor.
- Öğrenci hata yaparsa, nazikçe düzelt ve doğrusunu göster.
- Maksimum 3-4 cümle yaz.
- Gramer ipucu vermek istersen cevabın sonuna [💡 İpucu: ...] şeklinde ekle.`;
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':API_KEY,
        'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:600,system:sys,messages:m})
    });
    const d=await r.json();
    if(!r.ok)throw new Error(d.error?.message||'API xatolik');
    const rep=d.content[0].text;
    msgs=[...m,{role:'assistant',content:rep}];
    rmTyping(); addMsg('ai',rep);
  }catch(e){
    rmTyping(); showErr(e.message);
    if(isStart){document.getElementById('wel').style.display='flex';document.getElementById('iArea').classList.remove('on');}
  }finally{busy=false;dis(false);}
}

function send(){
  const ta=document.getElementById('cTa');
  const t=ta.value.trim(); if(!t||busy)return;
  ta.value=''; ta.style.height='auto';
  document.getElementById('sndBtn').disabled=true;
  addMsg('user',t);
  ai([...msgs,{role:'user',content:t}]);
}

function addMsg(role,text){
  const b=document.getElementById('msgs');
  const d=document.createElement('div');
  d.className=`msg ${role==='user'?'u':'ai'}`;
  d.innerHTML=`<div class="av">${role==='user'?'👤':'🤖'}</div>
    <div class="bub">${fmt(text)}</div>`;
  b.appendChild(d); b.scrollTop=b.scrollHeight;
}

function fmt(t){
  return t.split(/(\[💡[^\]]+\])/g).map(p=>
    p.startsWith('[💡')
      ?`<div class="tip">${p.slice(1,-1)}</div>`
      :`<span>${p.replace(/\n/g,'<br>')}</span>`
  ).join('');
}

function addTyping(){
  const b=document.getElementById('msgs');
  const d=document.createElement('div');
  d.className='msg ai';d.id='_t';
  d.innerHTML=`<div class="av">🤖</div><div class="bub"><div class="typing"><div class="td"></div><div class="td"></div><div class="td"></div></div></div>`;
  b.appendChild(d);b.scrollTop=b.scrollHeight;
}
function rmTyping(){const t=document.getElementById('_t');if(t)t.remove();}
function showErr(m){const e=document.getElementById('errBar');e.textContent='⚠️ '+m;e.classList.add('on');}
function hideErr(){document.getElementById('errBar').classList.remove('on');}
function dis(v){
  document.getElementById('cTa').disabled=v;
  document.getElementById('sndBtn').disabled=v||!document.getElementById('cTa').value.trim();
}
function rsz(el){
  el.style.height='auto';el.style.height=Math.min(el.scrollHeight,110)+'px';
  document.getElementById('sndBtn').disabled=!el.value.trim();
}
function taK(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}}
</script>
</body>
</html>
